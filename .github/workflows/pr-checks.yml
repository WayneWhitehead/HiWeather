name: PR Checks

on:
  pull_request:
    types: [opened, reopened, synchronize]

jobs:
  check-hardcoded-values:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find and comment on hardcoded values
        uses: actions/github-script@v5
        with:
          script: |

            // Get the list of changed files
            const changedFiles = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number
            });

            // Get existing comments
            const existingComments = await github.rest.pulls.listReviewComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number
            });

            for (const file of changedFiles.data) {
              if (file.filename.endsWith('.kt')) {
                // Get the diff of the changed file
                const diffLines = file.patch.split('\n').filter(line => line.startsWith('+') && !line.startsWith('++'));

                let lineNumber = 0;
                for (const line of file.patch.split('\n')) {
                  if (line.startsWith('@@')) {
                    // Extract the starting line number from the diff hunk header
                    const match = line.match(/@@ \-(\d+),\d+ \+(\d+),\d+ @@/);
                    if (match) {
                      lineNumber = parseInt(match[2]) - 1;
                    }
                  } else if (line.startsWith('+')) {
                    lineNumber++;
                    if (line.match(/"[^"]*"|[0-9]+\.dp/) && !line.includes('const val') && !line.includes('@SerializedName')) {
                      const message = `Hardcoded value found: ${line.trim()}`;

                      console.log(`File: ${file.filename}`);
                      console.log(`Line Number: ${lineNumber}`);
                      console.log(`Message: ${message}`);

                      // Check if there's already a comment from github-actions[bot] on this line
                      const existingComment = existingComments.data.find(comment => 
                        comment.path === file.filename && comment.line === lineNumber && comment.user.login === 'github-actions[bot]'
                      );

                      if (!existingComment) {
                        // Post a comment on the pull request
                        await github.rest.pulls.createReviewComment({
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          pull_number: context.payload.pull_request.number,
                          body: message,
                          commit_id: context.payload.pull_request.head.sha,
                          path: file.filename,
                          line: lineNumber,
                          side: 'RIGHT'
                        });
                      } else {
                        console.log(`Comment already exists from github-actions[bot] on ${file.filename} at line ${lineNumber}`);
                      }
                    }
                  } else if (!line.startsWith('-')) {
                    lineNumber++;
                  }
                }
              }
            }
            
  

  update-pr-details:
    runs-on: ubuntu-latest
    needs: check-hardcoded-values

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Update PR Title and Labels
        uses: actions/github-script@v5
        with:
          script: |
            const branchName = context.payload.pull_request.head.ref;
            const baseBranchName = context.payload.pull_request.base.ref;
            const prNumber = context.payload.pull_request.number;
            const prTitle = context.payload.pull_request.title;

            let newTitle = prTitle;
            let label = '';

            if (branchName.startsWith('feature/')) {
              newTitle = `✨ ${prTitle}`;
              label = 'Feature';
            } else if (branchName.startsWith('fixes/')) {
#             TODO update branch
              newTitle = `🐞 ${prTitle}`;
              label = 'Bugfix';
            } else if (branchName.startsWith('hotfix/')) {
              newTitle = `🚑 ${prTitle}`;
              label = 'Hotfix';
            } else if (branchName.startsWith('refactor/')) {
              newTitle = `🔧 ${prTitle}`;
              label = 'Refactor';
            } else if (branchName.startsWith('release/')) {
              newTitle = `${branchName} ➡️ ${baseBranchName}`;
              label = 'Release';
            }

            if (newTitle !== prTitle) {
              await github.rest.pulls.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber,
                title: newTitle
              });
            }

            if (label) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                labels: [label]
              });
            }
name: ViewModel Unit Tests

on:
  pull_request:
    types: [synchronize, opened, reopened]

jobs:
  viewmodel-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          echo "ADMOB_APP_KEY=${{ secrets.ADMOB_APP_KEY }}" >> local.properties
          echo "PLACES_KEY=${{ secrets.PLACES_KEY }}" >> local.properties
          echo "OPENWEATHER_KEY=${{ secrets.OPENWEATHER_KEY }}" >> local.properties

      - name: Fetch modified ViewModel files
        id: fetch-modified-viewmodel-files
        run: |
          MODIFIED_FILES=$(git diff --name-only HEAD^ HEAD | grep 'ViewModel\.kt$')
          echo "Modified ViewModel files found:"
          for file in $MODIFIED_FILES; do
            echo $file
          done
          echo "MODIFIED_FILES=$MODIFIED_FILES" >> $GITHUB_ENV

      - name: Check for Corresponding Test Files and Post Error Comment if Missing
        id: check-test-files
        uses: actions/github-script@v5
        with:
          script: |
            const modifiedFiles = process.env.MODIFIED_FILES.split('\n').filter(Boolean);
            let missingTestFiles = '';
            let testFiles = '';

            async function searchForTestFiles(directory, fileNamePattern1, fileNamePattern2) {
              try {
                const response = await github.rest.repos.getContent({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  path: directory
                });

                if (Array.isArray(response.data)) {
                  for (const item of response.data) {
                    if (item.type === 'dir') {
                      const foundFile = await searchForTestFiles(item.path, fileNamePattern1, fileNamePattern2);
                      if (foundFile) {
                        return foundFile;
                      }
                    } else if (item.type === 'file') {
                      if (fileNamePattern1.test(item.path)) {
                        console.log(`Found test file: ${item.path}`);
                        return item.path;
                      }
                      if (fileNamePattern2.test(item.path)) {
                        console.log(`Found test file: ${item.path}`);
                        return item.path;
                      }
                    }
                  }
                } else {
                  console.log(`No array returned for directory: ${directory}`);
                }
                return null;
              } catch (error) {
                console.error(`Error searching directory ${directory}:`, error);
                return null;
              }
            }

            (async () => {
              for (const file of modifiedFiles) {
                const fileNamePattern1 = new RegExp(file.split('/').pop().replace('ViewModel.kt', 'ViewModelTest.kt') + '$');
                const fileNamePattern2 = new RegExp(file.split('/').pop().replace('ViewModel.kt', 'ViewModelTests.kt') + '$');

                console.log(`Searching for test files: ${fileNamePattern1} or ${fileNamePattern2}`);

                const testFile = await searchForTestFiles('app/src/test/java', fileNamePattern1, fileNamePattern2);

                if (!testFile) {
                  missingTestFiles += `\n${file.replace('ViewModel.kt', 'ViewModelTest.kt')}\n${file.replace('ViewModel.kt', 'ViewModelTests.kt')}`;
                  console.log(`Missing test files: ${file.replace('ViewModel.kt', 'ViewModelTest.kt')} or ${file.replace('ViewModel.kt', 'ViewModelTests.kt')}`);
                } else {
                  testFiles += ` ${testFile}`;
                }
              }

              core.exportVariable('TEST_FILES', testFiles);

              if (missingTestFiles.trim()) {
                core.exportVariable('MISSING_TEST_FILES', 'true');
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.payload.pull_request.number,
                  body: `Error: Missing test files for modified ViewModel files:${missingTestFiles}`
                });
              } else {
                core.exportVariable('MISSING_TEST_FILES', 'false');
              }
            })();

      - name: Cache Gradle build cache
        if: env.TEST_FILES != ''
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Set up JDK 17
        if: env.TEST_FILES != ''
        uses: actions/setup-java@v4
        with:
          distribution: 'jetbrains'
          java-version: '17'

      - name: Set up Android SDK
        if: env.TEST_FILES != ''
        uses: android-actions/setup-android@v3

      - name: Generate Coverage Report
        if: env.TEST_FILES != ''
        run: ./gradlew createDebugUnitTestCoverageReport
        continue-on-error: true

      - name: Custom Script to Read Coverage Report
        if: env.TEST_FILES != ''
        uses: actions/github-script@v5
        with:
          script: |
            const fs = require('fs');
            const path = 'app/build/reports/coverage/test/debug/report.xml';
            const testFiles = process.env.TEST_FILES.split(' ').filter(Boolean);

            if (fs.existsSync(path)) {
              const report = fs.readFileSync(path, 'utf8');
              let missingTests = '';
              let instructionCoverage = 0;
              let lineCoverage = 0;
              let methodCoverage = 0;
              let classCoverage = 0;
              let totalInstructions = 0;
              let totalLines = 0;
              let totalMethods = 0;
              let totalClasses = 0;

              testFiles.forEach(file => {
                const className = file.split('/').pop().replace('.kt', '');
                const regex = new RegExp(`<class name="${className}"`, 'g');
                if (!regex.test(report)) {
                  missingTests += `\n${className}`;
                }
              });

              const instructionMatch = report.match(/<counter type="INSTRUCTION" missed="(\d+)" covered="(\d+)"\/>/);
              const lineMatch = report.match(/<counter type="LINE" missed="(\d+)" covered="(\d+)"\/>/);
              const methodMatch = report.match(/<counter type="METHOD" missed="(\d+)" covered="(\d+)"\/>/);
              const classMatch = report.match(/<counter type="CLASS" missed="(\d+)" covered="(\d+)"\/>/);

              if (instructionMatch) {
                totalInstructions = parseInt(instructionMatch[1]) + parseInt(instructionMatch[2]);
                instructionCoverage = (parseInt(instructionMatch[2]) / totalInstructions) * 100;
              }
              if (lineMatch) {
                totalLines = parseInt(lineMatch[1]) + parseInt(lineMatch[2]);
                lineCoverage = (parseInt(lineMatch[2]) / totalLines) * 100;
              }
              if (methodMatch) {
                totalMethods = parseInt(methodMatch[1]) + parseInt(methodMatch[2]);
                methodCoverage = (parseInt(methodMatch[2]) / totalMethods) * 100;
              }
              if (classMatch) {
                totalClasses = parseInt(classMatch[1]) + parseInt(classMatch[2]);
                classCoverage = (parseInt(classMatch[2]) / totalClasses) * 100;
              }

              const coverageReport = `
                Total Test Coverage:
                Type\tCoverage
                INSTRUCTION\t${instructionCoverage.toFixed(2)}% (${instructionMatch[2]}/${totalInstructions})
                LINE\t${lineCoverage.toFixed(2)}% (${lineMatch[2]}/${totalLines})
                METHOD\t${methodCoverage.toFixed(2)}% (${methodMatch[2]}/${totalMethods})
                CLASS\t${classCoverage.toFixed(2)}% (${classMatch[2]}/${totalClasses})
              `;

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body: coverageReport
              });

              if (missingTests.trim()) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.payload.pull_request.number,
                  body: `Error: Missing test coverage for the following classes:${missingTests}`
                });
              }
            } else {
              console.error(`Coverage report not found at path: ${path}`);
            }
        continue-on-error: true
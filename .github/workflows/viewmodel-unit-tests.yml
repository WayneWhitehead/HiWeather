name: ViewModel Unit Tests

on:
  pull_request:
    types: [synchronize, opened, reopened]

jobs:
  viewmodel-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'jetbrains'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          echo "ADMOB_APP_KEY=${{ secrets.ADMOB_APP_KEY }}" >> local.properties
          echo "PLACES_KEY=${{ secrets.PLACES_KEY }}" >> local.properties
          echo "OPENWEATHER_KEY=${{ secrets.OPENWEATHER_KEY }}" >> local.properties

      - name: Fetch modified ViewModel files
        id: fetch-modified-viewmodel-files
        run: |
          MODIFIED_FILES=$(git diff --name-only HEAD^ HEAD | grep 'ViewModel\.kt$')
          echo "MODIFIED_FILES=$MODIFIED_FILES" >> $GITHUB_ENV

      - name: Check for Corresponding Test Files and Post Error Comment if Missing
        id: check-test-files
        uses: actions/github-script@v5
        with:
          script: |
            const { context, github } = require('@actions/github');
            const core = require('@actions/core');

            const modifiedFiles = process.env.MODIFIED_FILES.split('\n').filter(Boolean);
            let missingTestFiles = '';
            let testFiles = '';

            async function fileExists(path) {
              try {
                await github.rest.repos.getContent({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  path: path
                });
                return true;
              } catch (error) {
                if (error.status === 404) {
                  return false;
                }
                throw error;
              }
            }

            (async () => {
              for (const file of modifiedFiles) {
                const testFile1 = file.replace('ViewModel.kt', 'ViewModelTest.kt');
                const testFile2 = file.replace('ViewModel.kt', 'ViewModelTests.kt');

                const testFile1Exists = await fileExists(testFile1);
                const testFile2Exists = await fileExists(testFile2);

                if (!testFile1Exists && !testFile2Exists) {
                  missingTestFiles += `\n${testFile1}\n${testFile2}`;
                  console.log(`Missing test files: ${testFile1} or ${testFile2}`);
                } else {
                  if (testFile1Exists) {
                    testFiles += ` ${testFile1}`;
                  }
                  if (testFile2Exists) {
                    testFiles += ` ${testFile2}`;
                  }
                }
              }

              core.exportVariable('TEST_FILES', testFiles);

              if (missingTestFiles.trim()) {
                core.exportVariable('MISSING_TEST_FILES', 'true');
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.payload.pull_request.number,
                  body: `Error: Missing test files for modified ViewModel files:${missingTestFiles}`
                });
              } else {
                core.exportVariable('MISSING_TEST_FILES', 'false');
              }
            })();
          env:
            MODIFIED_FILES: ${{ env.MODIFIED_FILES }}
            JAVA_HOME: /opt/hostedtoolcache/Java_JetBrains_jdk/17.0.14-1367.22/x64
            JAVA_HOME_17_X64: /opt/hostedtoolcache/Java_JetBrains_jdk/17.0.14-1367.22/x64
            ANDROID_HOME: /usr/local/lib/android/sdk
            ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

      - name: Run Unit Tests
        if: env.TEST_FILES != ''
        run: |
          for file in ${{ env.TEST_FILES }}; do
            TEST_CLASS=$(basename $file .kt)
            ./gradlew :app:testDebugUnitTest --tests "$TEST_CLASS"
          done

      - name: Generate Coverage Report
        run: ./gradlew jacocoTestReport

      - name: Verify Coverage
        id: verify-coverage
        run: |
          COVERAGE_FILE=build/reports/jacoco/test/jacocoTestReport.xml
          COVERAGE_REPORT=""
          for file in $(find . -name '*ViewModel.kt'); do
            FILE_NAME=$(basename $file)
            COVERAGE=$(grep -oP "name=\"$FILE_NAME\".*?covered=\".*?\" pct=\"\K\d+" $COVERAGE_FILE)
            COVERAGE_REPORT="$COVERAGE_REPORT\n$FILE_NAME: $COVERAGE%"
          done
          echo "COVERAGE_REPORT=$ ▋
name: ViewModel Unit Tests

on:
  pull_request:
    types: [synchronize, opened, reopened]

jobs:
  viewmodel-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'jetbrains'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          echo "ADMOB_APP_KEY=${{ secrets.ADMOB_APP_KEY }}" >> local.properties
          echo "PLACES_KEY=${{ secrets.PLACES_KEY }}" >> local.properties
          echo "OPENWEATHER_KEY=${{ secrets.OPENWEATHER_KEY }}" >> local.properties

      - name: Fetch modified ViewModel files
        id: fetch-modified-viewmodel-files
        run: |
          MODIFIED_FILES=$(git diff --name-only HEAD^ HEAD | grep 'ViewModel\.kt$')
          echo "Modified ViewModel files found:"
          for file in $MODIFIED_FILES; do
            echo $file
          done
          echo "MODIFIED_FILES=$MODIFIED_FILES" >> $GITHUB_ENV

      - name: Check for Corresponding Test Files and Post Error Comment if Missing
        id: check-test-files
        uses: actions/github-script@v5
        with:
          script: |
            const modifiedFiles = process.env.MODIFIED_FILES.split('\n').filter(Boolean);
            let missingTestFiles = '';
            let testFiles = '';

            async function searchForTestFiles(fileName) {
              const testFile1 = fileName.replace('ViewModel.kt', 'ViewModelTest.kt');
              const testFile2 = fileName.replace('ViewModel.kt', 'ViewModelTests.kt');

              async function findFile(path) {
                try {
                  const response = await github.rest.repos.getContent({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    path: path,
                    recursive: true
                  });

                  if (Array.isArray(response.data)) {
                    for (const item of response.data) {
                      if (item.type === 'file' && (item.path.endsWith(testFile1) || item.path.endsWith(testFile2))) {
                        return item.path;
                      }
                    }
                  }
                  return null;
                } catch (error) {
                  console.error(error);
                  return null;
                }
              }

              const foundTestFile1 = await findFile('app/src/main/test');
              const foundTestFile2 = await findFile('app/src/test');

              return foundTestFile1 || foundTestFile2;
            }

            (async () => {
              for (const file of modifiedFiles) {
                const fileName = file.split('/').pop();
                const foundTestFile = await searchForTestFiles(fileName);

                if (!foundTestFile) {
                  missingTestFiles += `\n${fileName.replace('ViewModel.kt', 'ViewModelTest.kt')}\n${fileName.replace('ViewModel.kt', 'ViewModelTests.kt')}`;
                  console.log(`Missing test files: ${fileName.replace('ViewModel.kt', 'ViewModelTest.kt')} or ${fileName.replace('ViewModel.kt', 'ViewModelTests.kt')}`);
                } else {
                  testFiles += ` ${foundTestFile}`;
                }
              }

              core.exportVariable('TEST_FILES', testFiles);

              if (missingTestFiles.trim()) {
                core.exportVariable('MISSING_TEST_FILES', 'true');
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.payload.pull_request.number,
                  body: `Error: Missing test files for modified ViewModel files:${missingTestFiles}`
                });
              } else {
                core.exportVariable('MISSING_TEST_FILES', 'false');
              }
            })();

      - name: Run Unit Tests
        if: env.TEST_FILES != ''
        run: |
          for file in ${{ env.TEST_FILES }}; do
            TEST_CLASS=$(basename $file .kt)
            ./gradlew :app:testDebugUnitTest --tests "$TEST_CLASS"
          done

      - name: Generate Coverage Report
        if: env.TEST_FILES != ''
        run: ./gradlew jacocoTestReport

      - name: Verify Coverage
        if: env.TEST_FILES != ''
        id: verify-coverage
        run: |
          COVERAGE_FILE=build/reports/jacoco/test/jacocoTestReport.xml
          COVERAGE_REPORT=""
          for file in $(find . -name '*ViewModel.kt ▋
name: ViewModel Unit Tests

on:
  pull_request:
    types: [synchronize, opened, reopened]

jobs:
  viewmodel-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Fetch modified files
        id: fetch-modified-files
        run: |
          MODIFIED_FILES=$(git diff --name-only HEAD^ HEAD)
          echo "Modified files found:"
          for file in $MODIFIED_FILES; do
            echo $file
          done
          echo "MODIFIED_FILES=$MODIFIED_FILES" >> $GITHUB_ENV

          VIEWMODEL_FILES=$(echo "$MODIFIED_FILES" | grep 'ViewModel\.kt$')
          echo "ViewModel files found:"
          for file in $VIEWMODEL_FILES; do
            echo $file
          done
          echo "VIEWMODEL_FILES=$VIEWMODEL_FILES" >> $GITHUB_ENV

      - name: Check for Corresponding Test Files
        id: check-test-files
        uses: actions/github-script@v5
        with:
          script: |
            const modifiedFiles = process.env.VIEWMODEL_FILES.split('\n').filter(Boolean);
            let missingTestFiles = '';
            let testFiles = '';

            async function searchForTestFiles(directory, fileNamePattern1, fileNamePattern2) {
              try {
                const response = await github.rest.repos.getContent({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  path: directory
                });

                if (Array.isArray(response.data)) {
                  for (const item of response.data) {
                    if (item.type === 'dir') {
                      const foundFile = await searchForTestFiles(item.path, fileNamePattern1, fileNamePattern2);
                      if (foundFile) {
                        return foundFile;
                      }
                    } else if (item.type === 'file') {
                      if (fileNamePattern1.test(item.path)) {
                        console.log(`Found test file: ${item.path}`);
                        return item.path;
                      }
                      if (fileNamePattern2.test(item.path)) {
                        console.log(`Found test file: ${item.path}`);
                        return item.path;
                      }
                    }
                  }
                } else {
                  console.log(`No array returned for directory: ${directory}`);
                }
                return null;
              } catch (error) {
                console.error(`Error searching directory ${directory}:`, error);
                return null;
              }
            }

            (async () => {
              for (const file of modifiedFiles) {
                const fileNamePattern1 = new RegExp(file.split('/').pop().replace('ViewModel.kt', 'ViewModelTest.kt') + '$');
                const fileNamePattern2 = new RegExp(file.split('/').pop().replace('ViewModel.kt', 'ViewModelTests.kt') + '$');

                console.log(`Searching for test files: ${fileNamePattern1} or ${fileNamePattern2}`);

                const testFile = await searchForTestFiles('app/src/test/java', fileNamePattern1, fileNamePattern2);

                if (!testFile) {
                  missingTestFiles += `\n${file.replace('ViewModel.kt', 'ViewModelTest.kt')}\n${file.replace('ViewModel.kt', 'ViewModelTests.kt')}`;
                  console.log(`Missing test files: ${file.replace('ViewModel.kt', 'ViewModelTest.kt')} or ${file.replace('ViewModel.kt', 'ViewModelTests.kt')}`);
                } else {
                  testFiles += ` ${testFile}`;
                }
              }

              core.exportVariable('TEST_FILES', testFiles);

              if (missingTestFiles.trim()) {
                core.exportVariable('MISSING_TEST_FILES', 'true');
              } else {
                core.exportVariable('MISSING_TEST_FILES', 'false');
              }
            })();

      - name: Post Error Comment if Missing
        if: env.MISSING_TEST_FILES == 'true'
        uses: actions/github-script@v5
        with:
          script: |
            const missingTestFiles = process.env.MISSING_TEST_FILES;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: `Error: Missing test files for modified ViewModel files:${missingTestFiles}`
            });

      - name: Cache Gradle build cache
        if: env.TEST_FILES != ''
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Create local.properties
        if: env.TEST_FILES != ''
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          echo "ADMOB_APP_KEY=${{ secrets.ADMOB_APP_KEY }}" >> local.properties
          echo "PLACES_KEY=${{ secrets.PLACES_KEY }}" >> local.properties
          echo "OPENWEATHER_KEY=${{ secrets.OPENWEATHER_KEY }}" >> local.properties

      - name: Set up JDK 17
        if: env.TEST_FILES != ''
        uses: actions/setup-java@v4
        with:
          distribution: 'jetbrains'
          java-version: '17'

      - name: Set up Android SDK
        if: env.TEST_FILES != ''
        uses: android-actions/setup-android@v3

      - name: Generate Coverage Report
        if: env.TEST_FILES != ''
        run: ./gradlew createDebugUnitTestCoverageReport
        continue-on-error: true

      - name: Search for Coverage Reports
        id: search-coverage-reports
        uses: actions/github-script@v5
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const modifiedFiles = process.env.MODIFIED_FILES.split('\n').filter(Boolean);
            let coverageFiles = '';

            async function findCoverageFile(baseDir, className) {
              const files = fs.readdirSync(baseDir, { withFileTypes: true });
              for (const file of files) {
                const filePath = path.join(baseDir, file.name);
                if (file.isDirectory()) {
                  const result = await findCoverageFile(filePath, className);
                  if (result) return result;
                } else if (file.isFile() && file.name === `${className}.html`) {
                  return filePath;
                }
              }
              return null;
            }

            (async () => {
              for (const file of modifiedFiles) {
                const className = file.split('/').pop().replace('.kt', '');
                const coverageFilePath = await findCoverageFile('app/build/reports/coverage/test/debug', className);
                if (coverageFilePath) {
                  coverageFiles += ` ${coverageFilePath}`;
                }
              }
              core.exportVariable('COVERAGE_FILES', coverageFiles);
            })();

      - name: Read and Format Coverage Reports
        id: read-format-coverage-reports
        uses: actions/github-script@v5
        with:
          script: |
            const fs = require('fs');
            const coverageFiles = process.env.COVERAGE_FILES.split(' ').filter(Boolean);
            let coverageDetails = '### Total Test Coverage:\n\n| Class | Line Coverage | Method Coverage |\n|-------|---------------|-----------------|\n';

            async function getCoverageDetails(filePath) {
              if (fs.existsSync(filePath)) {
                const report = fs.readFileSync(filePath, 'utf8');
                const lineRegex = /<td class="ctr2">(\d+)%<\/td>/g;
                const methodRegex = /<td class="ctr2">(\d+)%<\/td>/g;

                const lineMatches = [...report.matchAll(lineRegex)];
                const methodMatches = [...report.matchAll(methodRegex)];

                if (lineMatches.length > 0 && methodMatches.length > 0) {
                  const lineCoverage = parseInt(lineMatches[0][1]);
                  const methodCoverage = parseInt(methodMatches[0][1]);

                  return {
                    lineCoverage: lineCoverage.toFixed(2),
                    methodCoverage: methodCoverage.toFixed(2)
                  };
                }
              }
              return null;
            }

            (async () => {
              for (const filePath of coverageFiles) {
                const className = filePath.split('/').pop().replace('.html', '');
                const coverage = await getCoverageDetails(filePath);
                if (coverage) {
                  coverageDetails += `| ${className} | ${coverage.lineCoverage}% | ${coverage.methodCoverage}% |\n`;
                }
              }
              core.exportVariable('COVERAGE_DETAILS', coverageDetails);
            })();

      - name: Post Coverage Report Comment
        if: env.COVERAGE_DETAILS != ''
        uses: actions/github-script@v5
        with:
          script: |
            const coverageDetails = process.env.COVERAGE_DETAILS;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: coverageDetails
            });
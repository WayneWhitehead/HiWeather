name: ViewModel Unit Tests

on:
  pull_request:
    types: [synchronize, opened, reopened]

jobs:
  viewmodel-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'jetbrains'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          echo "ADMOB_APP_KEY=${{ secrets.ADMOB_APP_KEY }}" >> local.properties
          echo "PLACES_KEY=${{ secrets.PLACES_KEY }}" >> local.properties
          echo "OPENWEATHER_KEY=${{ secrets.OPENWEATHER_KEY }}" >> local.properties

      - name: Fetch modified ViewModel files
        id: fetch-modified-viewmodel-files
        run: |
          MODIFIED_FILES=$(git diff --name-only HEAD^ HEAD | grep 'ViewModel\.kt$')
          echo "Modified ViewModel files found:"
          for file in $MODIFIED_FILES; do
            echo $file
          done
          echo "MODIFIED_FILES=$MODIFIED_FILES" >> $GITHUB_ENV

      - name: Check for Corresponding Test Files and Post Error Comment if Missing
        id: check-test-files
        uses: actions/github-script@v5
        with:
          script: |
            const modifiedFiles = process.env.MODIFIED_FILES.split('\n').filter(Boolean);
            let missingTestFiles = '';
            let testFiles = '';

            async function searchForTestFiles(directory, fileNamePattern1, fileNamePattern2) {
              try {
                const response = await github.rest.repos.getContent({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  path: directory
                });

                if (Array.isArray(response.data)) {
                  for (const item of response.data) {
                    if (item.type === 'dir') {
                      const foundFile = await searchForTestFiles(item.path, fileNamePattern1, fileNamePattern2);
                      if (foundFile) {
                        return foundFile;
                      }
                    } else if (item.type === 'file') {
                      if (fileNamePattern1.test(item.path)) {
                        console.log(`Found test file: ${item.path}`);
                        return item.path;
                      }
                      if (fileNamePattern2.test(item.path)) {
                        console.log(`Found test file: ${item.path}`);
                        return item.path;
                      }
                    }
                  }
                } else {
                  console.log(`No array returned for directory: ${directory}`);
                }
                return null;
              } catch (error) {
                console.error(`Error searching directory ${directory}:`, error);
                return null;
              }
            }

            (async () => {
              for (const file of modifiedFiles) {
                const fileNamePattern1 = new RegExp(file.split('/').pop().replace('ViewModel.kt', 'ViewModelTest.kt') + '$');
                const fileNamePattern2 = new RegExp(file.split('/').pop().replace('ViewModel.kt', 'ViewModelTests.kt') + '$');

                console.log(`Searching for test files: ${fileNamePattern1} or ${fileNamePattern2}`);

                const testFile = await searchForTestFiles('app/src/test/java', fileNamePattern1, fileNamePattern2);

                if (!testFile) {
                  missingTestFiles += `\n${file.replace('ViewModel.kt', 'ViewModelTest.kt')}\n${file.replace('ViewModel.kt', 'ViewModelTests.kt')}`;
                  console.log(`Missing test files: ${file.replace('ViewModel.kt', 'ViewModelTest.kt')} or ${file.replace('ViewModel.kt', 'ViewModelTests.kt')}`);
                } else {
                  testFiles += ` ${testFile}`;
                }
              }

              core.exportVariable('TEST_FILES', testFiles);

              if (missingTestFiles.trim()) {
                core.exportVariable('MISSING_TEST_FILES', 'true');
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.payload.pull_request.number,
                  body: `Error: Missing test files for modified ViewModel files:${missingTestFiles}`
                });
              } else {
                core.exportVariable('MISSING_TEST_FILES', 'false');
              }
            })();

      - name: Cache Gradle build cache
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Generate Coverage Report
        if: env.TEST_FILES != ''
        run: ./gradlew createDebugUnitTestCoverageReport
        continue-on-error: true

      - name: Publish Unit Test Results
        uses: pooi/coverage-comment@1.0.3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          xml-test-report-path: ${SOURCE_PATH}app/build/reports/coverage/test/debug/report.xml
        continue-on-error: true

      - name: Parse Coverage Report
        if: env.TEST_FILES != ''
        id: parse-coverage
        run: |
          set -e
          COVERAGE_REPORT="app/build/reports/tests/testDebugUnitTest/index.html"

          if [[ ! -f "$COVERAGE_REPORT" ]]; then
            echo "Coverage report not found: $COVERAGE_REPORT"
            ls -l app/build/reports/tests/testDebugUnitTest/
            exit 1
          fi

          TESTS=$(grep -oP '(?<=<div class="counter">)\d+(?=</div>\n<p>tests</p>)' "$COVERAGE_REPORT")
          FAILURES=$(grep -oP '(?<=<div class="counter">)\d+(?=</div>\n<p>failures</p>)' "$COVERAGE_REPORT")
          IGNORED=$(grep -oP '(?<=<div class="counter">)\d+(?=</div>\n<p>ignored</p>)' "$COVERAGE_REPORT")
          DURATION=$(grep -oP '(?<=<div class="counter">)[\d.]+s(?=</div>\n<p>duration</p>)' "$COVERAGE_REPORT")
          SUCCESS_RATE=$(grep -oP '(?<=<div class="percent">)\d+%(?=</div>\n<p>successful</p>)' "$COVERAGE_REPORT")

          echo "TESTS=$TESTS" >> $GITHUB_ENV
          echo "FAILURES=$FAILURES" >> $GITHUB_ENV
          echo "IGNORED=$IGNORED" >> $GITHUB_ENV
          echo "DURATION=$DURATION" >> $GITHUB_ENV
          echo "SUCCESS_RATE=$SUCCESS_RATE" >> $GITHUB_ENV
        shell: /usr/bin/bash -e {0}
        env:
          JAVA_HOME: /opt/hostedtoolcache/Java_JetBrains_jdk/17.0.14-1367.22/x64
          JAVA_HOME_17_X64: /opt/hostedtoolcache/Java_JetBrains_jdk/17.0.14-1367.22/x64
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
          MODIFIED_FILES: app/src/main/java/com/hidesign/hiweather/presentation/WeatherViewModel.kt
          TEST_FILES: app/src/test/java/com/hidesign/hiweather/network/WeatherViewModelTest.kt
          MISSING_TEST_FILES: false

      - name: Post Coverage Comment
        if: env.TEST_FILES != ''
        uses: actions/github-script@v5
        with:
          script: |
            const tests = process.env.TESTS;
            const failures = process.env.FAILURES;
            const ignored = process.env.IGNORED;
            const duration = process.env.DURATION;
            const successRate = process.env.SUCCESS_RATE;

            const commentBody = `
            ## Test Coverage Report

            - **Tests**: ${tests}
            - **Failures**: ${failures}
            - **Ignored**: ${ignored}
            - **Duration**: ${duration}
            - **Success Rate**: ${successRate}
            `;

            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: commentBody
            });
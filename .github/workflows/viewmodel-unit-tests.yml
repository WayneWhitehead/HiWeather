name: ViewModel Unit Tests

on:
  pull_request:
    types: [synchronize, opened, reopened]

jobs:
  viewmodel-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'jetbrains'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          echo "ADMOB_APP_KEY=${{ secrets.ADMOB_APP_KEY }}" >> local.properties
          echo "PLACES_KEY=${{ secrets.PLACES_KEY }}" >> local.properties
          echo "OPENWEATHER_KEY=${{ secrets.OPENWEATHER_KEY }}" >> local.properties

      - name: Fetch modified ViewModel files
        id: fetch-modified-viewmodel-files
        run: |
          MODIFIED_FILES=$(git diff --name-only HEAD^ HEAD | grep 'ViewModel\.kt$')
          echo "MODIFIED_FILES=$MODIFIED_FILES" >> $GITHUB_ENV

      - name: Check for Corresponding Test Files
        id: check-test-files
        run: |
          MISSING_TEST_FILES=""
          for file in ${{ env.MODIFIED_FILES }}; do
            TEST_FILE=${file/ViewModel.kt/ViewModelTest.kt}
            if [ ! -f $TEST_FILE ]; then
              MISSING_TEST_FILES="$MISSING_TEST_FILES\n$TEST_FILE"
              echo "Missing test file: $TEST_FILE"
            else
              TEST_FILES="$TEST_FILES $TEST_FILE"
            fi
          done
          echo "TEST_FILES=$TEST_FILES" >> $GITHUB_ENV
          if [ -n "$MISSING_TEST_FILES" ]; then
            echo "MISSING_TEST_FILES=true" >> $GITHUB_ENV
          else
            echo "MISSING_TEST_FILES=false" >> $GITHUB_ENV

      - name: Post Error Comment on PR if Tests are Missing
        if: env.MISSING_TEST_FILES == 'true'
        uses: actions/github-script@v5
        with:
          script: |
            const missingTests = process.env.MISSING_TEST_FILES.split('\n').filter(Boolean).join('\n');
            github.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: `Error: Missing test files for modified ViewModel files:\n${missingTests}`
            })

      - name: Run Unit Tests
        if: env.TEST_FILES != ''
        run: |
          for file in ${{ env.TEST_FILES }}; do
            TEST_CLASS=$(basename $file .kt)
            ./gradlew :app:testDebugUnitTest --tests "$TEST_CLASS"
          done

      - name: Generate Coverage Report
        run: ./gradlew jacocoTestReport

      - name: Verify Coverage
        id: verify-coverage
        run: |
          COVERAGE_FILE=build/reports/jacoco/test/jacocoTestReport.xml
          COVERAGE_REPORT=""
          for file in $(find . -name '*ViewModel.kt'); do
            FILE_NAME=$(basename $file)
            COVERAGE=$(grep -oP "name=\"$FILE_NAME\".*?covered=\".*?\" pct=\"\K\d+" $COVERAGE_FILE)
            COVERAGE_REPORT="$COVERAGE_REPORT\n$FILE_NAME: $COVERAGE%"
          done
          echo "COVERAGE_REPORT=$ ▋
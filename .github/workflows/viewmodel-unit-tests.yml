name: ViewModel Unit Tests

on:
  pull_request:
    types: [synchronize, opened, reopened]

jobs:
  viewmodel-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          echo "ADMOB_APP_KEY=${{ secrets.ADMOB_APP_KEY }}" >> local.properties
          echo "PLACES_KEY=${{ secrets.PLACES_KEY }}" >> local.properties
          echo "OPENWEATHER_KEY=${{ secrets.OPENWEATHER_KEY }}" >> local.properties

      - name: Fetch modified ViewModel files
        id: fetch-modified-viewmodel-files
        run: |
          MODIFIED_FILES=$(git diff --name-only HEAD^ HEAD | grep 'ViewModel\.kt$')
          echo "Modified ViewModel files found:"
          for file in $MODIFIED_FILES; do
            echo $file
          done
          echo "MODIFIED_FILES=$MODIFIED_FILES" >> $GITHUB_ENV

      - name: Check for Corresponding Test Files and Post Error Comment if Missing
        id: check-test-files
        uses: actions/github-script@v5
        with:
          script: |
            const modifiedFiles = process.env.MODIFIED_FILES.split('\n').filter(Boolean);
            let missingTestFiles = '';
            let testFiles = '';

            async function searchForTestFiles(directory, fileNamePattern1, fileNamePattern2) {
              try {
                const response = await github.rest.repos.getContent({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  path: directory
                });

                if (Array.isArray(response.data)) {
                  for (const item of response.data) {
                    if (item.type === 'dir') {
                      const foundFile = await searchForTestFiles(item.path, fileNamePattern1, fileNamePattern2);
                      if (foundFile) {
                        return foundFile;
                      }
                    } else if (item.type === 'file') {
                      if (fileNamePattern1.test(item.path)) {
                        console.log(`Found test file: ${item.path}`);
                        return item.path;
                      }
                      if (fileNamePattern2.test(item.path)) {
                        console.log(`Found test file: ${item.path}`);
                        return item.path;
                      }
                    }
                  }
                } else {
                  console.log(`No array returned for directory: ${directory}`);
                }
                return null;
              } catch (error) {
                console.error(`Error searching directory ${directory}:`, error);
                return null;
              }
            }

            (async () => {
              for (const file of modifiedFiles) {
                const fileNamePattern1 = new RegExp(file.split('/').pop().replace('ViewModel.kt', 'ViewModelTest.kt') + '$');
                const fileNamePattern2 = new RegExp(file.split('/').pop().replace('ViewModel.kt', 'ViewModelTests.kt') + '$');

                console.log(`Searching for test files: ${fileNamePattern1} or ${fileNamePattern2}`);

                const testFile = await searchForTestFiles('app/src/test/java', fileNamePattern1, fileNamePattern2);

                if (!testFile) {
                  missingTestFiles += `\n${file.replace('ViewModel.kt', 'ViewModelTest.kt')}\n${file.replace('ViewModel.kt', 'ViewModelTests.kt')}`;
                  console.log(`Missing test files: ${file.replace('ViewModel.kt', 'ViewModelTest.kt')} or ${file.replace('ViewModel.kt', 'ViewModelTests.kt')}`);
                } else {
                  testFiles += ` ${testFile}`;
                }
              }

              core.exportVariable('TEST_FILES', testFiles);

              if (missingTestFiles.trim()) {
                core.exportVariable('MISSING_TEST_FILES', 'true');
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.payload.pull_request.number,
                  body: `Error: Missing test files for modified ViewModel files:${missingTestFiles}`
                });
              } else {
                core.exportVariable('MISSING_TEST_FILES', 'false');
              }
            })();

      - name: Cache Gradle build cache
        if: env.TEST_FILES != ''
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Set up JDK 17
        if: env.TEST_FILES != ''
        uses: actions/setup-java@v4
        with:
          distribution: 'jetbrains'
          java-version: '17'

      - name: Set up Android SDK
        if: env.TEST_FILES != ''
        uses: android-actions/setup-android@v3

      - name: Generate Coverage Report
        if: env.TEST_FILES != ''
        run: ./gradlew createDebugUnitTestCoverageReport
        continue-on-error: true

      - name: Custom Script to Read Coverage Report
        if: env.TEST_FILES != ''
        uses: actions/github-script@v5
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const testFiles = process.env.TEST_FILES.split(' ').filter(Boolean);

            async function getCoverageDetails(filePath) {
              if (fs.existsSync(filePath)) {
                const report = fs.readFileSync(filePath, 'utf8');
                const lineRegex = /<counter type="LINE" missed="(\d+)" covered="(\d+)"\/>/;
                const methodRegex = /<counter type="METHOD" missed="(\d+)" covered="(\d+)"\/>/;

                const lineMatch = lineRegex.exec(report);
                const methodMatch = methodRegex.exec(report);

                if (lineMatch && methodMatch) {
                  const totalLines = parseInt(lineMatch[1]) + parseInt(lineMatch[2]);
                  const lineCoverage = (parseInt(lineMatch[2]) / totalLines) * 100;
                  const totalMethods = parseInt(methodMatch[1]) + parseInt(methodMatch[2]);
                  const methodCoverage = (parseInt(methodMatch[2]) / totalMethods) * 100;

                  return {
                    lineCoverage: lineCoverage.toFixed(2),
                    methodCoverage: methodCoverage.toFixed(2),
                    totalLines,
                    coveredLines: lineMatch[2],
                    totalMethods,
                    coveredMethods: methodMatch[2]
                  };
                }
              }
              return null;
            }

            (async () => {
              let coverageDetails = 'Total Test Coverage:\nType\tCoverage\n';
              let missingTests = '';

              for (const file of testFiles) {
                const className = file.split('/').pop().replace('.kt', '');
                const coverageFilePath = path.join('app/build/reports/coverage/test/debug/com/hidesign/hiweather/presentation', `${className}.html`);

                const coverage = await getCoverageDetails(coverageFilePath);

                if (coverage) {
                  coverageDetails += `${className}\nLINE\t${coverage.lineCoverage}% (${coverage.coveredLines}/${coverage.totalLines})\nMETHOD\t${coverage.methodCoverage}% (${coverage.coveredMethods}/${coverage.totalMethods})\n`;
                } else {
                  missingTests += `\n${className}`;
                }
              }

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body: coverageDetails
              });

              if (missingTests.trim()) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
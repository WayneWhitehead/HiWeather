name: ViewModel Unit Tests

on:
  pull_request:
    types: [synchronize, opened, reopened]

jobs:
  viewmodel-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check for ViewModel Test Files
        id: fetch-and-check-viewmodel-files
        uses: actions/github-script@v5
        with:
          script: |
            const execSync = require('child_process').execSync;
            const modifiedFiles = execSync('git diff --name-only HEAD^ HEAD | grep "ViewModel\\.kt$"').toString().trim().split('\n').filter(Boolean);

            console.log("Modified ViewModel files found:");
            modifiedFiles.forEach(file => console.log(file));

            let missingTestFiles = '';
            let testFiles = '';

            async function searchForTestFiles(directory, fileNamePattern) {
              try {
                const response = await github.rest.repos.getContent({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  path: directory
                });

                if (Array.isArray(response.data)) {
                  for (const item of response.data) {
                    if (item.type === 'dir') {
                      const foundFile = await searchForTestFiles(item.path, fileNamePattern);
                      if (foundFile) {
                        return foundFile;
                      }
                    } else if (item.type === 'file' && fileNamePattern.test(item.path)) {
                      console.log(`Found test file: ${item.path}`);
                      return item.path;
                    }
                  }
                } else {
                  console.log(`No array returned for directory: ${directory}`);
                }
                return null;
              } catch (error) {
                console.error(`Error searching directory ${directory}:`, error);
                return null;
              }
            }

            (async () => {
              for (const file of modifiedFiles) {
                const fileNamePattern = new RegExp(file.split('/').pop().replace('ViewModel.kt', 'ViewModelTest.kt') + '$');

                console.log(`Searching for test files: ${fileNamePattern}`);

                const testFile = await searchForTestFiles('app/src/test/java', fileNamePattern);

                if (!testFile) {
                  missingTestFiles += `\n${file.replace('ViewModel.kt', 'ViewModelTest.kt')}`;
                  console.log(`Missing test file: ${file.replace('ViewModel.kt', 'ViewModelTest.kt')}`);
                } else {
                  testFiles += ` ${testFile}`;
                }
              }

              core.exportVariable('TEST_FILES', testFiles);

              if (missingTestFiles.trim()) {
                core.exportVariable('MISSING_TEST_FILES', 'true');
              } else {
                core.exportVariable('MISSING_TEST_FILES', 'false');
              }
            })();

      - name: Post Missing ViewModel Tests
        if: env.MISSING_TEST_FILES == 'true'
        uses: actions/github-script@v5
        with:
          script: |
            const missingTestFiles = process.env.MISSING_TEST_FILES;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: `Error: Missing test files for modified ViewModel files:${missingTestFiles}`
            });

      - name: Cache Gradle build cache
        if: env.TEST_FILES != ''
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          echo "ADMOB_APP_KEY=${{ secrets.ADMOB_APP_KEY }}" >> local.properties
          echo "PLACES_KEY=${{ secrets.PLACES_KEY }}" >> local.properties
          echo "OPENWEATHER_KEY=${{ secrets.OPENWEATHER_KEY }}" >> local.properties

      - name: Set up JDK 17
        if: env.TEST_FILES != ''
        uses: actions/setup-java@v4
        with:
          distribution: 'jetbrains'
          java-version: '17'

      - name: Set up Android SDK
        if: env.TEST_FILES != ''
        uses: android-actions/setup-android@v3

      - name: Generate Coverage Report
        if: env.TEST_FILES != ''
        run: ./gradlew createDebugUnitTestCoverageReport
        continue-on-error: true

      - name: Search for Coverage Reports
        id: search-coverage-reports
        uses: actions/github-script@v5
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const execSync = require('child_process').execSync;

            const modifiedFiles = execSync('git diff --name-only HEAD^ HEAD').toString().trim().split('\n').filter(Boolean);
            const viewModelFiles = modifiedFiles.filter(file => file.endsWith('ViewModel.kt'));
            const otherFiles = modifiedFiles.filter(file => !file.endsWith('ViewModel.kt'));

            let viewModelCoverageFiles = '';
            let otherCoverageFiles = '';

            async function findCoverageFile(baseDir, className) {
              const files = fs.readdirSync(baseDir, { withFileTypes: true });
              for (const file of files) {
                const filePath = path.join(baseDir, file.name);
                if (file.isDirectory()) {
                  const result = await findCoverageFile(filePath, className);
                  if (result) return result;
                } else if (file.isFile() && file.name === `${className}.html`) {
                  return filePath;
                }
              }
              return null;
            }

            (async () => {
              for (const file of viewModelFiles) {
                const className = file.split('/').pop().replace('ViewModel.kt', '');
                const coverageFilePath = await findCoverageFile('app/build/reports/coverage/test/debug', className);
                if (coverageFilePath) {
                  viewModelCoverageFiles += ` ${coverageFilePath}`;
                }
              }

              for (const file of otherFiles) {
                const className = file.split('/').pop().replace('.kt', '');
                const coverageFilePath = await findCoverageFile('app/build/reports/coverage/test/debug', className);
                if (coverageFilePath) {
                  otherCoverageFiles += ` ${coverageFilePath}`;
                }
              }

              core.exportVariable('VIEWMODEL_COVERAGE_FILES', viewModelCoverageFiles);
              core.exportVariable('OTHER_COVERAGE_FILES', otherCoverageFiles);
            })();

      - name: Read and Format Coverage Reports
        id: read-format-coverage-reports
        uses: actions/github-script@v5
        with:
          script: |
            const fs = require('fs');

            const viewModelCoverageFiles = process.env.VIEWMODEL_COVERAGE_FILES.split(' ').filter(Boolean);
            const otherCoverageFiles = process.env.OTHER_COVERAGE_FILES.split(' ').filter(Boolean);

            let viewModelCoverageDetails = '### ViewModel Test Coverage:\n\n| Class | Line Coverage | Method Coverage |\n|-------|---------------|-----------------|\n';
            let otherCoverageDetails = '### Other Test Coverage:\n\n| Class | Line Coverage | Method Coverage |\n|-------|---------------|-----------------|\n';

            async function getCoverageDetails(filePath) {
              console.log(`Checking file: ${filePath}`);
              if (fs.existsSync(filePath)) {
                const report = fs.readFileSync(filePath, 'utf8');
                console.log(`File read successfully: ${filePath}`);
                const lineRegex = /<td class="ctr2">(\d+)%<\/td>/g;
                const methodRegex = /<td class="ctr2">(\d+)%<\/td>/g;

                const lineMatches = [...report.matchAll(lineRegex)];
                const methodMatches = [...report.matchAll(methodRegex)];

                console.log(`Line matches: ${lineMatches.length}, Method matches: ${methodMatches.length}`);

                if (lineMatches.length > 0 && methodMatches.length > 0) {
                  const lineCoverage = parseInt(lineMatches[0][1]);
                  const methodCoverage = parseInt(methodMatches[0][1]);

                  console.log(`Line coverage: ${lineCoverage}%, Method coverage: ${methodCoverage}%`);

                  return {
                    lineCoverage: lineCoverage.toFixed(2),
                    methodCoverage: methodCoverage.toFixed(2)
                  };
                } else {
                  console.log(`No valid matches found in file: ${filePath}`);
                }
              } else {
                console.log(`File does not exist: ${filePath}`);
              }
              return null;
            }

            (async () => {
              for (const filePath of viewModelCoverageFiles) {
                const className = filePath.split('/').pop().replace('.html', '');
                const coverage = await getCoverageDetails(filePath);
                if (coverage) {
                  viewModelCoverageDetails += `| ${className} | ${coverage.lineCoverage}% | ${coverage.methodCoverage}% |\n`;
                }
              }

              for (const filePath of otherCoverageFiles) {
                const className = filePath.split('/').pop().replace('.html', '');
                const coverage = await getCoverageDetails(filePath);
                if (coverage) {
                  otherCoverageDetails += `| ${className} | ${coverage.lineCoverage}% | ${coverage.methodCoverage}% |\n`;
                }
              }

              core.exportVariable('VIEWMODEL_COVERAGE_DETAILS', viewModelCoverageDetails);
              core.exportVariable('OTHER_COVERAGE_DETAILS', otherCoverageDetails);
            })();

      - name: Post Coverage Report Comment
        if: env.VIEWMODEL_COVERAGE_DETAILS != '' || env.OTHER_COVERAGE_DETAILS != ''
        uses: actions/github-script@v5
        with:
          script: |
            const viewModelCoverageDetails = process.env.VIEWMODEL_COVERAGE_DETAILS;
            const otherCoverageDetails = process.env.OTHER_COVERAGE_DETAILS;

            if (viewModelCoverageDetails.trim() !== '### ViewModel Test Coverage:\n\n| Class | Line Coverage | Method Coverage |\n|-------|---------------|-----------------|\n') {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body: viewModelCoverageDetails
              });
            }

            if (otherCoverageDetails.trim() !== '### Other Test Coverage:\n\n| Class | Line Coverage | Method Coverage |\n|-------|---------------|-----------------|\n') {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body: otherCoverageDetails
              });
            }